name: Deploy PWA (Pages)

# Monta a PWA (app/ + dados de content/ + partituras do PDF) e publica no GitHub Pages.
# Requer Settings → Pages → Source = GitHub Actions (uma vez).

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["app/**", "content/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python3 -m pip install --quiet PyMuPDF
      - run: python3 content/build_abc.py   # gera content/notes_abc.json (ABC p/ o player)
      - run: python3 app/build_site.py
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
